[package]
name = "glb-undraco"
version = "0.1.0"
edition = "2021"
description = "Rewrites a KHR_draco_mesh_compression GLB as plain accessors, for Godot's glTF loader"

[dependencies]
draco-gltf = { version = "0.5", default-features = false, features = ["read", "draco-decode", "write"] }

[dev-dependencies]
serde_json = "1"
